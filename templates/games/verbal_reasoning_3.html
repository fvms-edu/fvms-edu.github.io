<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVMS Senior Verbal Reasoning Portal</title>
    <style>
        :root {
            --bg-dark: #030a05;
            --glass-bg: rgba(6, 20, 10, 0.75);
            --glass-border: rgba(57, 255, 20, 0.2);
            --neon-green: #39ff14;
            --neon-blue: #00f3ff;
            --neon-amber: #ffb86c;
            --text-main: #e6f7ec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #092410 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 850px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green);
            margin-bottom: 25px;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Forms and Selectors */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #0d3a1a, #051a0b);
            border: 1px solid var(--neon-green);
            color: #fff;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(57, 255, 20, 0.1);
        }

        .btn:hover {
            box-shadow: 0 0 20px var(--neon-green);
            transform: translateY(-2px);
        }

        /* HUD layout */
        .hud-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            text-align: center;
        }

        .hud-metric span {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-top: 4px;
        }

        .nyvona-bubble {
            background: rgba(0, 0, 0, 0.5);
            border-left: 4px solid var(--neon-green);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-style: italic;
            line-height: 1.4;
        }

        /* Pool and Zone Interactivity layouts */
        .zone-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8fa395;
            margin-bottom: 8px;
        }

        .tray {
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            min-height: 85px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .play-zone {
            border-style: solid;
            border-color: var(--neon-blue);
            background: rgba(0, 15, 25, 0.4);
        }

        .token {
            background: linear-gradient(135deg, #122416, #070f09);
            border: 1px solid var(--neon-green);
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .token:active {
            cursor: grabbing;
        }

        /* Powerups grid layout */
        .powerup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-utility {
            background: transparent;
            border: 1px solid var(--neon-amber);
            color: var(--neon-amber);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-utility:hover:not(:disabled) {
            background: rgba(255, 184, 108, 0.1);
            box-shadow: 0 0 10px var(--neon-amber);
        }

        .btn-utility:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Badge Matrix collection */
        .badge-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }

        .badge-icon {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            font-size: 0.8rem;
            opacity: 0.4;
        }

        .badge-icon.unlocked {
            opacity: 1;
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
        }

        /* Hidden functional overlay hidden input */
        #keyboard-sink {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <input type="text" id="keyboard-sink" autofocus>

    <div class="game-container">
              <a href="../../index.html?id=#games" style=" border: none; text-decoration: none; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1rem; padding: 10px 20px; border-radius: 60px; cursor: pointer; transition: all 0.2s ease; color: #2c5e2c; background: #fef3e0;"> Back to FVMS <i class="fas fa-project-diagram"></i> Game Hub</a>

        <h1>FVMS Game Zone</h1>

        <!-- VIEW 1: INTRODUCTORY & SETUP -->
        <div id="panel-setup" class="panel active">
            <div class="nyvona-bubble" id="setup-greeting">
                Initializing verbal tracking models...
            </div>
            
            <div class="form-group">
                <label for="player-name">Your Name</label>
                <input type="text" id="player-name" placeholder="Enter student name...">
            </div>

            <div class="form-group">
                <label for="difficulty-select">Difficulty Mode</label>
                <select id="difficulty-select">
                    <option value="adaptive">Adaptive Mode (Default Scaling)</option>
                    <option value="easy">Easy Mode</option>
                    <option value="difficult">Difficult Mode</option>
                    <option value="advanced">Advanced Mode</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time-select">Thinking Time Limit</label>
                <select id="time-select">
                    <option value="adaptive">No Selection (Adaptive Tuning)</option>
                    <option value="30">30 Seconds</option>
                    <option value="60">1 Minute</option>
                    <option value="180">3 Minutes</option>
                    <option value="300">5 Minutes</option>
                </select>
            </div>

            <button class="btn" id="btn-initialize">Launch Matrix</button>
        </div>

        <!-- VIEW 2: VERBAL ENGINE MATRIX -->
        <div id="panel-matrix" class="panel">
            <div class="hud-bar">
                <div class="hud-metric">Score <span id="stat-score">0</span></div>
                <div class="hud-metric">Streak <span id="stat-streak">0x</span></div>
                <div class="hud-metric">Time Left <span id="stat-timer">--:--</span></div>
                <div class="hud-metric">Level <span id="stat-level">Easy</span></div>
            </div>

            <div class="nyvona-bubble" id="nyvona-host-speech">
                Prepare your mind...
            </div>

            <div class="zone-title" id="pool-title">Available Tray Pool (Click or Drag items)</div>
            <div class="tray" id="tray-pool"></div>

            <div class="zone-title">Active Play Zone Arrangement Line</div>
            <div class="tray play-zone" id="tray-play"></div>

            <div class="powerup-grid">
                <button class="btn-utility" id="power-hint">Hint Card</button>
                <button class="btn-utility" id="power-shuffle">Shuffle Tray</button>
            </div>

            <div class="badge-box">
                <div class="zone-title" style="text-align: center;">Unlocked Achievement Badges</div>
                <div class="badge-grid">
                    <div class="badge-icon" id="badge-streak">🔥 Perfect Streak</div>
                    <div class="badge-icon" id="badge-speed">⚡ Speed Demon</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global App Core State
        const engine = {
            playerName: "Explorer",
            configMode: "adaptive",
            timeLimitSetting: "adaptive",
            currentScore: 0,
            streakCount: 0,
            timerInstance: null,
            secondsRemaining: 0,
            activeSolution: [],
            currentPoolItems: [],
            currentArrangement: [],
            currentLevelIndex: 0,
            isSentenceMode: false,
            hintsLeft: 3,
            dailyTriggered: false
        };

        // Complete Verbal Reasoning Multi-tiered Databases
        const taskPool = {
            words: [
                { source: ["w","e","a","t","h","e","r"], target: "weather" },
                { source: ["m","a","t","r","i","x"], target: "matrix" },
                { source: ["v","e","r","b","a","l"], target: "verbal" },
                { source: ["s","c","i","e","n","c","e"], target: "science" }
            ],
            sentences: [
                { source: ["shall", "sun", "soon", "shine", "The"], target: "The sun shall soon shine." },
                { source: ["mind", "is", "The", "weapon", "strongest"], target: "The mind is strongest weapon." },
                { source: ["is", "knowledge", "FVMS", "where", "power"], target: "FVMS is where knowledge power." }
            ]
        };

        // Document Reference Bindings
        const UI = {
            setupPanel: document.getElementById('panel-setup'),
            matrixPanel: document.getElementById('panel-matrix'),
            setupGreeting: document.getElementById('setup-greeting'),
            inputName: document.getElementById('player-name'),
            selectDifficulty: document.getElementById('difficulty-select'),
            selectTime: document.getElementById('time-select'),
            btnInitialize: document.getElementById('btn-initialize'),
            hostSpeech: document.getElementById('nyvona-host-speech'),
            trayPool: document.getElementById('tray-pool'),
            trayPlay: document.getElementById('tray-play'),
            lblScore: document.getElementById('stat-score'),
            lblStreak: document.getElementById('stat-streak'),
            lblTimer: document.getElementById('stat-timer'),
            lblLevel: document.getElementById('stat-level'),
            btnHint: document.getElementById('power-hint'),
            btnShuffle: document.getElementById('power-shuffle'),
            badgeStreak: document.getElementById('badge-streak'),
            badgeSpeed: document.getElementById('badge-speed'),
            keyboardSink: document.getElementById('keyboard-sink')
        };

        // Text-to-Speech Vocal Engine
        function nyvonaVocalize(phrase) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const soundbite = new SpeechSynthesisUtterance(phrase);
                soundbite.rate = 0.95;
                soundbite.pitch = 1.1;
                window.speechSynthesis.speak(soundbite);
            }
            UI.hostSpeech.innerText = phrase;
        }

        // Initialize setup screen instructions on view mount
        window.addEventListener('DOMContentLoaded', () => {
            UI.setupGreeting.innerText = "Welcome to Famous Vine Montessori School game zone! Here you are going to play a verbal reasoning game.";
            nyvonaVocalize(UI.setupGreeting.innerText);
            syncSavedBadges();
        });

        // Setup submission and extraction sequence
        UI.btnInitialize.addEventListener('click', () => {
            const tempName = UI.inputName.value.trim();
            if(!tempName) {
                nyvonaVocalize("Please input your name to let me customize your tracking matrices.");
                return;
            }
            engine.playerName = tempName;
            engine.configMode = UI.selectDifficulty.value;
            engine.timeLimitSetting = UI.selectTime.value;

            // Transition UI State
            UI.setupPanel.classList.remove('active');
            UI.matrixPanel.classList.add('active');
            
            // Bring keyboard focus to catch fast entries
            document.addEventListener('click', () => UI.keyboardSink.focus());
            UI.keyboardSink.focus();

            initializeNextPuzzleTask();
        });

        // Central Processing Loop for generating and scheduling challenges
        function initializeNextPuzzleTask() {
            clearInterval(engine.timerInstance);
            engine.currentArrangement = [];
            UI.trayPlay.innerHTML = "";

            // Evaluate if puzzle alternates to Sentence Structure layer
            engine.isSentenceMode = (engine.configMode === 'advanced') || 
                                     (engine.configMode === 'adaptive' && engine.currentScore >= 40) ||
                                     (Math.random() > 0.5 && engine.configMode === 'difficult');

            let selectionPool = engine.isSentenceMode ? taskPool.sentences : taskPool.words;
            let currentSelection = selectionPool[Math.floor(Math.random() * selectionPool.length)];
            
            engine.currentPoolItems = [...currentSelection.source];
            // Capture expected normalized targets
            engine.activeSolution = engine.isSentenceMode ? currentSelection.target.replace(/[.]/g, "").split(" ") : currentSelection.target.split("");

            if (engine.isSentenceMode) {
                nyvonaVocalize(`${engine.playerName}, this round focuses on Sentence Structure! Rearrange the words.`);
                document.getElementById('pool-title').innerText = "Available Word Tray Pool (Click or Drag items)";
            } else {
                nyvonaVocalize(`Let's solve this vocabulary puzzle, ${engine.playerName}. Reorder the letters.`);
                document.getElementById('pool-title').innerText = "Available Letter Tray Pool (Click or Drag items)";
            }

            renderPoolInterface();
            configureClockSchedules();
            refreshDashboardLabels();
        }

        // DOM Rendering and Native Drag & Drop Management
        function renderPoolInterface() {
            UI.trayPool.innerHTML = "";
            engine.currentPoolItems.forEach((item, index) => {
                if(item === null) return;
                const token = document.createElement('div');
                token.className = "token";
                token.innerText = item;
                token.draggable = true;
                token.dataset.index = index;

                // Tap / Click handling triggers swift migration
                token.addEventListener('click', () => commitTokenToPlayZone(index));

                // HTML5 Drag Event Pipelines
                token.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index);
                });

                UI.trayPool.appendChild(token);
            });
        }

        // Configure landing drop frames on target playzones
        UI.trayPlay.addEventListener('dragover', (e) => e.preventDefault());
        UI.trayPlay.addEventListener('drop', (e) => {
            e.preventDefault();
            const retrievedIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if(!isNaN(retrievedIdx)) {
                commitTokenToPlayZone(retrievedIdx);
            }
        });

        // Disappear elements from current state pool and assign to alignment zone
        function commitTokenToPlayZone(index) {
            const tokenValue = engine.currentPoolItems[index];
            if(tokenValue === null) return;

            engine.currentPoolItems[index] = null; // Vanish from standard selection matrix arrays
            engine.currentArrangement.push(tokenValue);

            // Re-render subtrees
            renderPoolInterface();
            renderActivePlayZone();
            evaluateArrangementSolution();
        }

        function renderActivePlayZone() {
            UI.trayPlay.innerHTML = "";
            engine.currentArrangement.forEach((item, index) => {
                const token = document.createElement('div');
                token.className = "token";
                token.innerText = item;
                // Clicking item path returns it back into the selection pools
                token.addEventListener('click', () => {
                    engine.currentArrangement.splice(index, 1);
                    // Locate first open void and re-insert string content back
                    const openPosition = engine.currentPoolItems.indexOf(null);
                    if(openPosition !== -1) {
                        engine.currentPoolItems[openPosition] = item;
                    } else {
                        engine.currentPoolItems.push(item);
                    }
                    renderPoolInterface();
                    renderActivePlayZone();
                });
                UI.trayPlay.appendChild(token);
            });
        }

        // Handle keystroke capture inputs mirroring pool removal loops
        UI.keyboardSink.addEventListener('input', (e) => {
            const keyedChar = e.target.value.toLowerCase().slice(-1);
            e.target.value = ""; // Flush buffer instantly

            if(!engine.isSentenceMode) {
                // Find matching single matching literal string in source array stack
                const matchedIdx = engine.currentPoolItems.findIndex(char => char && char.toLowerCase() === keyedChar);
                if(matchedIdx !== -1) {
                    commitTokenToPlayZone(matchedIdx);
                }
            }
        });

        // Evaluate user structure arrays against targeted schema mappings
        function evaluateArrangementSolution() {
            // Wait for user to extract and allocate everything from tray arrays
            const remainingTokens = engine.currentPoolItems.filter(i => i !== null);
            if(remainingTokens.length > 0) return;

            const structuredAttempt = engine.currentArrangement.join(" ").toLowerCase();
            const expectedTarget = engine.activeSolution.join(" ").toLowerCase();

            if (structuredAttempt === expectedTarget) {
                // SUCCESS ROUTE PIPELINES
                clearInterval(engine.timerInstance);
                engine.streakCount++;
                let rawGain = engine.isSentenceMode ? 20 : 10;
                let finalAward = rawGain * (engine.streakCount >= 3 ? 2 : 1);
                
                // Track early completion performance window criteria
                if(engine.timeLimitSetting !== 'adaptive' && engine.secondsRemaining > (parseInt(engine.timeLimitSetting) / 2)) {
                    finalAward += 5; // Speed bonus award
                    UI.badgeSpeed.classList.add('unlocked');
                    localStorage.setItem('badge_speed', 'true');
                }

                engine.currentScore += finalAward;

                if(engine.streakCount >= 3) {
                    UI.badgeStreak.classList.add('unlocked');
                    localStorage.setItem('badge_streak', 'true');
                }

                nyvonaVocalize(`Fantastic alignment, ${engine.playerName}! That is perfectly correct!`);
                setTimeout(initializeNextPuzzleTask, 2500);
            } else {
                // FAILURE PATHWAY EVALUATORS
                engine.streakCount = 0;
                nyvonaVocalize(`Don't give up, ${engine.playerName}! Check the order and try another approach.`);
                setTimeout(() => {
                    // Reset and recycle present puzzle configuration space
                    engine.currentPoolItems = [...engine.currentArrangement.filter(i => i !== null)];
                    // Re-add missing array records
                    engine.currentArrangement = [];
                    UI.trayPlay.innerHTML = "";
                    initializeNextPuzzleTask();
                }, 3000);
            }
            refreshDashboardLabels();
        }

        // Realtime Evaluation Timer Matrices
        function configureClockSchedules() {
            if(engine.timeLimitSetting === 'adaptive') {
                // Auto-tune difficulty boundaries recursively based on progression score footprints
                engine.secondsRemaining = engine.currentScore >= 40 ? 45 : 90;
            } else {
                engine.secondsRemaining = parseInt(engine.timeLimitSetting, 10);
            }

            UI.lblTimer.innerText = formatTimeLayout(engine.secondsRemaining);

            engine.timerInstance = setInterval(() => {
                engine.secondsRemaining--;
                UI.lblTimer.innerText = formatTimeLayout(engine.secondsRemaining);

                if(engine.secondsRemaining <= 0) {
                    clearInterval(engine.timerInstance);
                    engine.streakCount = 0;
                    nyvonaVocalize(`Time has run out on this layer, ${engine.playerName}. Let's refresh variables.`);
                    setTimeout(initializeNextPuzzleTask, 2000);
                }
            }, 1000);
        }

        // Power-Up Mechanics
        UI.btnShuffle.addEventListener('click', () => {
            // Scramble remaining active letters in pool array elements
            let values = engine.currentPoolItems.filter(v => v !== null);
            for (let i = values.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [values[i], values[j]] = [values[j], values[i]];
            }
            // Remap back down to index structure values
            let valIdx = 0;
            engine.currentPoolItems = engine.currentPoolItems.map(item => item === null ? null : values[valIdx++]);
            renderPoolInterface();
        });

        UI.btnHint.addEventListener('click', () => {
            if(engine.hintsLeft <= 0) return;
            
            // Reveal next expected token node element matching target
            const targetIndexToReveal = engine.currentArrangement.length;
            const expectedTokenValue = engine.activeSolution[targetIndexToReveal];

            if(expectedTokenValue) {
                const poolTargetIdx = engine.currentPoolItems.findIndex(item => item && item.toLowerCase() === expectedTokenValue.toLowerCase());
                if(poolTargetIdx !== -1) {
                    engine.hintsLeft--;
                    UI.btnHint.innerText = `Hint Card (${engine.hintsLeft})`;
                    if(engine.hintsLeft === 0) UI.btnHint.disabled = true;
                    commitTokenToPlayZone(poolTargetIdx);
                }
            }
        });

        // System Diagnostic Utility Wrappers
        function formatTimeLayout(totalSecs) {
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function refreshDashboardLabels() {
            UI.lblScore.innerText = engine.currentScore;
            UI.lblStreak.innerText = `${engine.streakCount}x`;
            UI.lblLevel.innerText = engine.isSentenceMode ? "Structure" : "Vocabulary";
        }

        function syncSavedBadges() {
            if(localStorage.getItem('badge_streak') === 'true') UI.badgeStreak.classList.add('unlocked');
            if(localStorage.getItem('badge_speed') === 'true') UI.badgeSpeed.classList.add('unlocked');
        }
    </script>
</body>
</html>
